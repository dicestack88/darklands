<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b12">
  <title>Set your password — Darklands</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="assets/js/supabase-config.js"></script>
  <script defer src="assets/js/set-password.js"></script>
<script defer src="assets/js/theme.js"></script>
</head>
<body class="auth-page">
  <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
  <header class="site-header"><a class="brand" href="./"><span class="brand-mark">D</span><span>DARKLANDS</span></a></header>
  <main class="auth-layout">
    <section class="auth-aside"><div class="eyebrow"><span class="status-dot"></span> YOUR COMMUNITY AWAITS</div><h1>One last<br><span>step.</span></h1><p>Choose a password to finish setting up your Darklands account.</p></section>
    <section class="auth-card">
      <div class="eyebrow">ACCOUNT SETUP</div><h2>Set your password</h2>
      <p class="auth-subtitle">Use at least 8 characters. Keep it private.</p>
      <form class="auth-form" id="set-password-form">
        <label for="password">New password</label>
        <div class="password-wrap"><input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required><button class="password-toggle" type="button" data-toggle-password="password">Show</button></div>
        <label for="confirm-password">Confirm password</label>
        <input id="confirm-password" name="confirm-password" type="password" minlength="8" autocomplete="new-password" required>
        <button class="button button-full" type="submit">Save password <span aria-hidden="true">→</span></button>
        <p class="form-message" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <script>
    document.querySelectorAll("[data-toggle-password]").forEach(button => button.addEventListener("click", () => {
      const field = document.getElementById(button.dataset.togglePassword);
      const show = field.type === "password";
      field.type = show ? "text" : "password";
      button.textContent = show ? "Hide" : "Show";
    }));
  </script>
<script src="assets/js/navigation.js"></script>
</body>
</html>
